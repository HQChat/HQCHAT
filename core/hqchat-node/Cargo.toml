[package]
name = "hqchat-node"
description = "The HQChat core for Node: the server's protocol checks, the hqn/1 responder, and the Engine for the bot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
hqc = { path = "../hqc" }
hqchat-engine = { path = "../hqchat-engine" }
hqchat-protocol = { path = "../hqchat-protocol" }
napi = "3"
napi-derive = "3"

[build-dependencies]
napi-build = "2"

# No unsafe is written here, but napi's macros expand to it, so the
# workspace's forbid cannot apply.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
