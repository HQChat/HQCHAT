[package]
name = "hqchat-node"
description = "The HQChat core for Node: the server's protocol checks, the hqn/1 responder, and the Engine for the bot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
hex = "0.4"
hqc = { path = "../hqc" }
hqchat-engine = { path = "../hqchat-engine" }
hqchat-protocol = { path = "../hqchat-protocol" }
napi = "3"
napi-derive = "3"
serde_json = "1"
zeroize = "1"

[build-dependencies]
napi-build = "2"

# No unsafe is written here. napi's macros expand to unsafe under their own
# allow, which `forbid` rejects; `deny` still refuses any we write.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unused_must_use = "deny"
unused_qualifications = "warn"

# The workspace set (see ../Cargo.toml); Cargo cannot inherit part of it.
[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
indexing_slicing = "warn"
string_slice = "warn"
get_unwrap = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
