[package]
name = "hqchat-ffi"
description = "The HQChat Engine for Swift and Kotlin (uniffi): the apps implement KeyVault and Store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "hqchat_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
hqchat-engine = { path = "../hqchat-engine" }
thiserror = "2"
uniffi = { version = "0.32", features = ["cli"] }

# No unsafe is written here, but uniffi's macros expand to it, so the
# workspace's forbid cannot apply.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
