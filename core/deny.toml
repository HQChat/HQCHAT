# Supply-chain checks for the core (`cargo deny check`, run by
# scripts/check.sh core): no crate with a known vulnerability or a yanked
# release, no licence AGPL-3.0 cannot carry, nothing from outside crates.io.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check, vulnerabilities and unmaintained
# crates alike; an exception goes here with the advisory id and a reason.
yanked = "deny"
unmaintained = "all"
ignore = [
    # basic-toml is unmaintained. It comes in through askama_derive, which
    # uniffi's bindings generator uses at build time to read its own
    # templates and uniffi.toml: nothing it parses comes from outside the
    # repository, and it ships in no binary. Drop this when uniffi moves off it.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, through uniffi's askama; parses no untrusted input" },
]

[licenses]
# Permissive licences and MPL-2.0 (uniffi, file-level copyleft), all
# compatible with AGPL-3.0-only.
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate is a cost, not a risk: reported, not refused.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
