[package]
name = "hqc-sys"
description = "The HQC-256 C build (native/hqc at the pinned upstream commit) and its raw FFI"
links = "hqc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
cc = "1"

# The one crate allowed `unsafe`: it declares the C functions and wraps each in
# a safe function over fixed-size arrays. Every other crate forbids it.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unused_must_use = "deny"
unused_qualifications = "warn"

# The workspace set (see ../Cargo.toml); Cargo cannot inherit part of it.
[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
indexing_slicing = "warn"
string_slice = "warn"
get_unwrap = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
