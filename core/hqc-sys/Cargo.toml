[package]
name = "hqc-sys"
description = "The HQC-256 C build (native/hqc at the pinned upstream commit) and its raw FFI"
links = "hqc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
cc = "1"

# The one crate allowed `unsafe`: it declares the C functions and wraps each in
# a safe function over fixed-size arrays. Every other crate forbids it.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
