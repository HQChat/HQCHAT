%% HQChat broker ACL: the whole policy. Mounted read-only at
%% /opt/emqx/etc/hqchat-acl.conf (never the image's permissive acl.conf).
%%
%% u/{id}/...        addressed by client id; ${clientid} is authenticated and
%%                   equal to the username, so ownership is enforced here.
%% cv/{id}, hs/{id}  random ids (64 hex digits from two UUIDs: 244 random
%%                   bits) handed only to a friendship's two members:
%%                   knowing the id is the permission. Safe only because
%%                   emqx.conf turns client wildcards off.
%%
%% Superusers (the push bridge, internal listener only) bypass this file.
%% Rules are evaluated top to bottom; the first match wins.

%% Presence: the owner publishes (retained + LWT); anyone may read it.
{allow, all, publish, ["u/${clientid}/presence"]}.
{allow, all, subscribe, ["u/+/presence"]}.

%% Inbox and graph nudges: the owner alone subscribes. The server publishes
%% graph nudges through the admin API, which this file is never asked about, so
%% nothing grants `publish` on a graph topic.
{allow, all, subscribe, ["u/${clientid}/inbox", "u/${clientid}/graph"]}.

%% Publishing into an inbox, a conversation or a handshake — never retained. A
%% retained frame would replay to every later subscriber of the topic.
{allow, all, {publish, [{retain, false}]}, ["u/+/inbox", "cv/+", "hs/+"]}.
{allow, all, subscribe, ["cv/+", "hs/+"]}.

%% Everything else.
{deny, all}.
