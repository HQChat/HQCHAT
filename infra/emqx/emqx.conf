## HQChat broker configuration. A template: every @NAME@ is filled in by
## infra/nixos/modules/mqtt.nix for the hosts and by the scenario harness for CI.
##
## Security invariants:
##   - wildcard subscriptions are off for clients; acl.conf allows `cv/+` and
##     `hs/+` to everyone because a conversation id is the capability, and a
##     wildcard filter would match those rules;
##   - only the internal listener (push bridge, its own authn hook) allows them;
##   - no cookie here: it is generated per host and passed as EMQX_NODE__COOKIE.

node {
  name = "emqx@127.0.0.1"
  data_dir = "/opt/emqx/data"
}

## Clients over WebSocket, behind nginx, which also limits each client
## address (infra/nixos/modules/nginx.nix). Every CONNECT costs the auth
## service a database lookup, so the listener caps the total as well.
listeners.ws.default {
  bind = "@WS_BIND@"
  websocket.mqtt_path = "/mqtt"
  max_connections = 100000
  max_conn_rate = 500
  messages_rate = "50/s"
  bytes_rate = "1MB/s"
}

## Clients over hqn/1: noise-gw pipes each decrypted stream here.
listeners.tcp.gw {
  bind = "@GW_BIND@"
  max_connections = 200000
  max_conn_rate = 2000
  messages_rate = "50/s"
  bytes_rate = "1MB/s"
}

## The push bridge only.
listeners.tcp.internal {
  bind = "@INTERNAL_BIND@"
  zone = internal
  max_connections = 64
  authentication = [
    {
      mechanism = password_based
      backend = http
      method = post
      url = "@AUTH_URL@/mqtt/authn/internal"
      headers { "content-type" = "application/json" }
      body {
        username = "${username}"
        password = "${password}"
        clientid = "${clientid}"
      }
      request_timeout = "5s"
    }
  ]
}
listeners.tcp.default { enable = false }
listeners.ssl.default { enable = false }
listeners.wss.default { enable = false }

mqtt { wildcard_subscription = false }
zones.internal { mqtt { wildcard_subscription = true } }

## Resource limits. Any account may publish into any inbox and subscribe to
## any `cv/`/`hs/` id, so nothing a client sends may grow the broker without
## bound.
##   - packets: the clients' own limit (MAX_PACKET_BYTES in
##     core/hqchat-protocol/src/mqtt.rs); the largest real one, an init, is
##     about 82 kB;
##   - subscriptions: a user holds its inbox, graph and own presence, and per
##     friend (FRIEND_CAP = 150) a conversation, a handshake and a presence;
##   - offline queues keep QoS 1 only: every real frame is QoS 1, so junk at
##     QoS 0 cannot push a friend's message out of a full queue.
mqtt.max_packet_size = "256KB"
mqtt.max_subscriptions = 512
mqtt.mqueue_store_qos0 = false

## Nothing uses delayed publish, which would park any client's messages for
## up to 49 days, on disc and in RAM.
delayed { enable = false }

## Only presence is retained (acl.conf), and a presence payload is a few
## bytes: a client may not park a megabyte on its own topic.
retainer { max_payload_size = "1KB" }

## Refuse new work, rather than die, when memory or the run queue is short.
overload_protection { enable = true }

## Every client CONNECT is a signed proof checked by the auth service, which
## also requires clientid == username.
authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "@AUTH_URL@/mqtt/authn"
    headers { "content-type" = "application/json" }
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
    request_timeout = "5s"
  }
]

## acl.conf is the whole policy. A refusal answers the packet, never the connection.
authorization {
  no_match = deny
  deny_action = ignore
  cache { enable = false }
  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/hqchat-acl.conf"
    }
  ]
}

dashboard {
  listeners.http { bind = "@API_BIND@" }
  default_username = "admin"
}
