# Archive the iOS and macOS apps, sign them and upload a new version of each to
# App Store Connect (apps/apple/release.sh). Every run ships, per platform, a
# version and a build number strictly above everything already in App Store
# Connect (apps/apple/asc-next.mjs):
#
#   push to main   when the Apple apps or the HQC library change; the patch
#                  version goes up by one
#   manual run     optionally with a version (e.g. 3.1.0), which must be higher
#                  than every version already uploaded, and a choice of platforms
#   deploy.yml     after a successful verify, when ship_apple is on
#
# Environment secrets (production): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (an
# App Store Connect API key, role App Manager or Admin). Submitting a build for
# review stays manual.
name: Apple release

on:
  push:
    branches: [main]
    paths:
      - "apps/apple/**"
      - "native/hqc/**"
      - "!**.md"
  workflow_dispatch:
    inputs:
      version:
        description: Version to ship (e.g. 3.1.0); empty bumps the patch of the latest one
        type: string
        required: false
      platforms:
        description: Apps to ship
        type: choice
        options: ["ios macos", ios, macos]
        default: "ios macos"
  workflow_call:
    inputs:
      environment:
        type: string
        default: production
      version:
        type: string
        required: false

permissions:
  contents: read

jobs:
  # A manual run may ship one platform; macOS minutes are too dear to start a
  # runner only to skip it.
  platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        env:
          PLATFORMS: ${{ inputs.platforms || 'ios macos' }}
        run: echo "list=$(jq -cn --arg p "$PLATFORMS" '$p | split(" ")')" >>"$GITHUB_OUTPUT"

  release:
    needs: platforms
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.list) }}
    # One platform's runs queue rather than race, so two never pick the same number.
    concurrency:
      group: apple-release-${{ matrix.platform }}
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Use the newest Xcode on the runner
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
      - name: Archive, sign and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: bash apps/apple/release.sh "$PLATFORM"
