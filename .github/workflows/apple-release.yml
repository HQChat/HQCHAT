# Archive the iOS app, sign it and upload a new version to App Store Connect
# (apps/apple/release.sh). Every run ships a version and a build number strictly
# above everything already in App Store Connect (apps/apple/asc-next.mjs):
#
#   push to main   when the Apple apps, the Rust core, the HQC library or the
#                  toolchain pins change; the patch version goes up by one
#   manual run     optionally with a version (e.g. 3.1.0), which must be higher
#                  than every version already uploaded; macOS can be picked too
#   deploy.yml     after a successful verify, when ship_apple is on
#
# Only iOS ships unless a manual run asks for macOS, which needs its own App
# Store Connect record (martin.rougeron.DissQus).
#
# The core's static libraries are built here, from the commit being shipped
# (core/hqchat-ffi/build-apple.sh in `nix develop .#apple`); none is committed.
#
# Environment secrets (production): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8: an
# App Store Connect team API key with the Admin role, which cloud-managed
# distribution signing requires. Submitting a build for
# review stays manual.
name: Apple release

on:
  push:
    branches: [main]
    paths:
      - "apps/apple/**"
      - "core/**"
      - "native/hqc/**"
      - "flake.nix"
      - "flake.lock"
      - "!**.md"
  workflow_dispatch:
    inputs:
      version:
        description: Version to ship (e.g. 3.1.0); empty bumps the patch of the latest one
        type: string
        required: false
      platforms:
        description: Apps to ship
        type: choice
        options: [ios, "ios macos", macos]
        default: ios
  workflow_call:
    inputs:
      environment:
        type: string
        default: production
      version:
        type: string
        required: false

permissions:
  contents: read

jobs:
  # Only the platforms a run ships get a runner; macOS minutes are too dear to
  # start one only to skip it.
  platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      # Only main's history is uploaded with the App Store Connect key: main
      # itself, or (called from deploy.yml) an app-store/ tag on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The ref is main, or an App Store tag on main
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            refs/tags/app-store/*)
              git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
                echo "::error::$GITHUB_REF ($GITHUB_SHA) is not a commit on main"
                exit 1
              }
              ;;
            *)
              echo "::error::Apple releases run from main, not $GITHUB_REF"
              exit 1
              ;;
          esac
      - id: list
        env:
          PLATFORMS: ${{ inputs.platforms || 'ios' }}
        run: echo "list=$(jq -cn --arg p "$PLATFORMS" '$p | split(" ")')" >>"$GITHUB_OUTPUT"

  release:
    needs: platforms
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.list) }}
    # One platform's runs queue rather than race, so two never pick the same number.
    concurrency:
      group: apple-release-${{ matrix.platform }}
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Use the newest Xcode on the runner
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-apple-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-apple-${{ runner.os }}-
          gc-max-store-size-macos: 4G
      # From source on this runner: what ships is what this commit's core,
      # HQC pin and toolchain compile to. The bindings are committed so that
      # changes to them are reviewed; ones that differ from what the core
      # generates stop the release.
      - name: Build the Rust core (HQChatCore)
        run: nix develop .#apple --command core/hqchat-ffi/build-apple.sh
      - name: The committed bindings are the generated ones
        run: |
          git diff --exit-code -- core/swift/HQChatCore/Sources || {
            echo "::error::core/swift/HQChatCore/Sources differs from what the core generates: run build-apple.sh and commit the result"
            exit 1
          }
      - name: Archive, sign and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: bash apps/apple/release.sh "$PLATFORM"
