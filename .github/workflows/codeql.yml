# CodeQL over the JavaScript and TypeScript: the server, the site Worker and
# the release scripts under apps/apple. Swift needs an Xcode build to be
# analysed and is left out; the Rust core has cargo deny and clippy (ci.yml).
name: CodeQL

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["**.ts", "**.js", "**.mjs", ".github/workflows/codeql.yml"]
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:javascript-typescript
