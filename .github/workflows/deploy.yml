# One click: deploy the selected ref ("Use workflow from") to an environment,
# from an empty DigitalOcean account or over a running one. The ref is main, or
# an app-store/<version> tag on a commit of main (app-store.yml); any other is
# refused before a job that holds a secret starts.
#
#   ci        the full CI suite, the two-VM stack test included; skipped when
#             this exact commit already passed CI (push to main), so a deploy
#             does not pay for the same suite twice
#   build     both host closures and the environment's image, signed, pushed to the
#             cache; warns first if the server or app Sentry DSN is empty
#   infra     Terraform (guarded), then each host's secret bundle
#   release   move channels/<environment>/<role>, signed with the cache key;
#             hosts switch within minutes
#   verify    /health reports this commit and a healthy broker, on the domain and
#             on the apps' API host, then the functional scenarios run against
#             the live environment
#   rollback  if verify fails, the channels go back to the release this run
#             replaced
#   apple     once verify passes (and ship_apple is on): apple-release.yml
#             uploads a new version of the iOS app to App Store Connect
#   app-store once verify passes (and app_store_version is set): releases that
#             approved App Store version, so the app goes live only against a
#             server proven to speak its protocol (app-store.yml sets it)
#
# Environment secrets: DIGITALOCEAN_TOKEN, CLOUDFLARE_API_TOKEN, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, NIX_CACHE_SIGNING_KEY, BOT_SEED, NOISE_KEYS,
# AGE_IDENTITY_APP, AGE_IDENTITY_MQTT (the hosts' age post-quantum identities) and,
# optionally, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, APNS_KEY_P8,
# ANTHROPIC_API_KEY (the helper's AI replies; docs/runbooks/anthropic-key.md)
# (infra/scripts/init-environment.sh sets the generated ones); for the apple job,
# ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (an App Store Connect API key).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy (infra/environments/<name>.json)
        type: environment
        required: true
      allow_replace:
        description: Allow destroying or replacing protected resources (droplets, volume, database, address, firewalls, zone settings, DNS, keys; infra/scripts/tf-guard.sh)
        type: boolean
        default: false
      ship_apple:
        description: After a successful verify, build the iOS app and upload it to App Store Connect
        type: boolean
        default: true
      app_store_version:
        description: After a successful verify, release this approved (Pending Developer Release) App Store version
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ inputs.environment }}

jobs:
  # Fails, never skips: the jobs below run on `!failure()`, and a skipped
  # ancestor would let them through.
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The ref is main, or an App Store tag on main
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            refs/tags/app-store/*)
              git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
                echo "::error::$GITHUB_REF ($GITHUB_SHA) is not a commit on main"
                exit 1
              }
              ;;
            *)
              echo "::error::deploys run from main or an app-store/ tag, not $GITHUB_REF"
              exit 1
              ;;
          esac

  ci-passed:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" -q .total_count)
          echo "passed=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >>"$GITHUB_OUTPUT"

  # A called workflow gets at most its caller's permissions; ci.yml asks for
  # pull-requests: read (paths-filter lists a PR's files with it).
  ci:
    needs: ci-passed
    if: needs.ci-passed.outputs.passed != 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  # `!cancelled() && !failure()` lets a skipped `ci` through; GitHub would
  # otherwise skip every job downstream of a skipped one.
  build:
    needs: [source, ci-passed, ci]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    outputs:
      app: ${{ steps.build.outputs.app }}
      mqtt: ${{ steps.build.outputs.mqtt }}
      image_url: ${{ steps.image.outputs.url }}
      image_name: ${{ steps.image.outputs.name }}
      cache_url: ${{ steps.env.outputs.cache_url }}
      cache_key: ${{ steps.env.outputs.cache_key }}
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Sentry is configured (warns, never fails)
        run: infra/scripts/check-sentry.sh "$ENVIRONMENT"
      - name: Read the environment
        id: env
        run: |
          f="infra/environments/$ENVIRONMENT.json"
          {
            echo "cache_url=$(jq -r .cache.url "$f")"
            echo "cache_key=$(jq -r .cache.publicKey "$f")"
            echo "bucket=$(jq -r .cache.bucket "$f")"
            echo "endpoint=https://$(jq -r .cloudflare.accountId "$f").r2.cloudflarestorage.com"
          } >>"$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            extra-substituters = ${{ steps.env.outputs.cache_url }}
            extra-trusted-public-keys = ${{ steps.env.outputs.cache_key }}
      - name: Build the closures and the image
        id: build
        run: |
          for role in app mqtt; do
            nix build ".#toplevel-$ENVIRONMENT-$role" --print-build-logs --out-link "result-$role"
            echo "$role=$(readlink -f "result-$role")" >>"$GITHUB_OUTPUT"
          done
          nix build ".#image-$ENVIRONMENT" --print-build-logs --out-link result-image
      - name: Sign and push the closures
        env:
          SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          printf '%s' "$SIGNING_KEY" >"$RUNNER_TEMP/cache.key"
          # ./ makes them paths: a bare word is read as a flake registry name.
          nix store sign --key-file "$RUNNER_TEMP/cache.key" --recursive ./result-app ./result-mqtt
          rm -f "$RUNNER_TEMP/cache.key"
          nix copy --to "s3://${{ steps.env.outputs.bucket }}?endpoint=${{ steps.env.outputs.endpoint }}&region=auto" \
            ./result-app ./result-mqtt
      - name: Upload the image
        id: image
        run: |
          source infra/scripts/lib.sh
          id="$(basename "$(readlink -f result-image)" | cut -c1-12)"
          key="images/$ENVIRONMENT/$id.qcow2"
          r2 ls "s3://${{ steps.env.outputs.bucket }}/$key" >/dev/null || \
            r2 cp result-image/nixos.qcow2 "s3://${{ steps.env.outputs.bucket }}/$key" --content-type application/octet-stream
          echo "url=${{ steps.env.outputs.cache_url }}/$key" >>"$GITHUB_OUTPUT"
          echo "name=hqchat-$ENVIRONMENT-$id" >>"$GITHUB_OUTPUT"

  infra:
    needs: build
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    outputs:
      domain: ${{ steps.apply.outputs.domain }}
      api_host: ${{ steps.apply.outputs.api_host }}
      mqtt_ipv4: ${{ steps.apply.outputs.mqtt_ipv4 }}
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_image_url: ${{ needs.build.outputs.image_url }}
      TF_VAR_image_name: ${{ needs.build.outputs.image_name }}
      ALLOW_REPLACE: ${{ inputs.allow_replace }}
      AGE_IDENTITY_APP: ${{ secrets.AGE_IDENTITY_APP }}
      AGE_IDENTITY_MQTT: ${{ secrets.AGE_IDENTITY_MQTT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # hqcat-server comes from the cache build just pushed to, not a rebuild.
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            extra-substituters = ${{ needs.build.outputs.cache_url }}
            extra-trusted-public-keys = ${{ needs.build.outputs.cache_key }}
      - name: Terraform
        id: apply
        run: |
          TF_OUTPUTS="$RUNNER_TEMP/tf-outputs.json"
          echo "TF_OUTPUTS=$TF_OUTPUTS" >>"$GITHUB_ENV"
          export TF_OUTPUTS
          # Handed to a new droplet in its user data; the bundles are sealed to them.
          TF_VAR_age_identities="$(jq -cn '{app: env.AGE_IDENTITY_APP, mqtt: env.AGE_IDENTITY_MQTT} | with_entries(select(.value != ""))')"
          export TF_VAR_age_identities
          # The Terraform pinned by hash in the flake, not a download trusted on TLS alone.
          nix shell .#terraform --command infra/scripts/terraform.sh "$ENVIRONMENT" apply
          {
            echo "domain=$(jq -r .domain.value "$TF_OUTPUTS")"
            echo "api_host=$(jq -r .api_host.value "$TF_OUTPUTS")"
            echo "mqtt_ipv4=$(jq -r .hqn_ipv4.value "$TF_OUTPUTS")"
          } >>"$GITHUB_OUTPUT"
      - name: Publish the secret bundles
        env:
          BOT_SEED: ${{ secrets.BOT_SEED }}
          NOISE_KEYS: ${{ secrets.NOISE_KEYS }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          BOT_ID="$(nix shell .#hqcat-bot --command hqcat-bot --print-id)"
          export BOT_ID
          nix shell --inputs-from . nixpkgs#age nixpkgs#awscli2 nixpkgs#openssl --command infra/scripts/publish-secrets.sh "$ENVIRONMENT"
      - name: Remove the Terraform outputs
        if: always()
        run: rm -f "$TF_OUTPUTS"

  release:
    needs: [build, infra]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    outputs:
      app_previous: ${{ steps.move.outputs.app_previous }}
      mqtt_previous: ${{ steps.move.outputs.mqtt_previous }}
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Move the channels
        id: move
        env:
          APP: ${{ needs.build.outputs.app }}
          MQTT: ${{ needs.build.outputs.mqtt }}
        run: infra/scripts/release.sh "$ENVIRONMENT" promote "$APP" "$MQTT"

  verify:
    needs: [build, infra, release]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      DOMAIN: ${{ needs.infra.outputs.domain }}
      API_HOST: ${{ needs.infra.outputs.api_host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The scenarios load the core addon (HQCHAT_NODE); the release's own build
      # is in the cache, inside the server's closure.
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            extra-substituters = ${{ needs.build.outputs.cache_url }}
            extra-trusted-public-keys = ${{ needs.build.outputs.cache_key }}
      - name: The core addon
        run: echo "HQCHAT_NODE=$(nix build .#hqchat-node --no-link --print-out-paths)/lib/hqchat_node.node" >>"$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/package-lock.json
      - run: npm ci --prefix services
      - name: Wait for this commit to serve, with a healthy broker
        run: |
          for _ in $(seq 1 120); do
            health="$(curl -fsS --max-time 10 "https://$DOMAIN/health" || true)"
            if jq -e --arg v "$GITHUB_SHA" '.version == $v and .broker == []' <<<"$health" >/dev/null 2>&1; then
              echo "serving $GITHUB_SHA"
              exit 0
            fi
            echo "waiting: ${health:-no answer}"
            sleep 15
          done
          echo "::error::$DOMAIN never served $GITHUB_SHA with a healthy broker"
          exit 1
      - name: The apps' API host reaches the same server
        run: |
          health="$(curl -fsS --max-time 10 "https://$API_HOST/health" || true)"
          jq -e --arg v "$GITHUB_SHA" '.version == $v' <<<"$health" >/dev/null 2>&1 || {
            echo "::error::https://$API_HOST/health does not serve $GITHUB_SHA: the apps cannot reach this server (${health:-no answer})"
            exit 1
          }
      # The origin's address is looked up here and masked before any use: it is
      # never a job output or a step variable, which the public log would show.
      - name: Only the expected ports answer
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          HQN_IPV4: ${{ needs.infra.outputs.mqtt_ipv4 }}
        run: |
          APP_IPV4="$(curl -fsS -H @<(printf 'Authorization: Bearer %s\n' "$DIGITALOCEAN_TOKEN") \
            "https://api.digitalocean.com/v2/droplets?tag_name=hqchat-$ENVIRONMENT-app" |
            jq -r '[.droplets[].networks.v4[] | select(.type == "public") | .ip_address][0] // empty')"
          [ -n "$APP_IPV4" ] || { echo "::error::no app droplet found for $ENVIRONMENT"; exit 1; }
          echo "::add-mask::$APP_IPV4"
          ! curl -sk --max-time 5 -o /dev/null "https://$APP_IPV4/health" || { echo "::error::the origin answers outside Cloudflare"; exit 1; }
          for port in 1883 1884 8083 8081 18083; do
            ! nc -z -w 3 "$HQN_IPV4" "$port" || { echo "::error::the broker answers on $port"; exit 1; }
          done
          nc -z -w 5 "$HQN_IPV4" 443
      - name: Functional scenarios against the environment
        working-directory: services/server
        env:
          # The apps sign in at the API host, the only origin AUTH_ORIGINS gives
          # them; the apex would be refused with BAD_ORIGIN.
          TEST_BASE_URL: https://${{ needs.infra.outputs.api_host }}
          TEST_MQTT_URL: wss://${{ needs.infra.outputs.domain }}/mqtt
          TEST_EXPECT_VERSION: ${{ github.sha }}
          SCENARIOS_REQUIRED: "1"
        run: npm run test:scenarios

  rollback:
    needs: [release, verify]
    if: always() && needs.release.result == 'success' && needs.verify.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # What this run's release replaced, never a pointer read back from the bucket.
      - name: Return the channels to the previous release
        env:
          APP: ${{ needs.release.outputs.app_previous }}
          MQTT: ${{ needs.release.outputs.mqtt_previous }}
        run: infra/scripts/release.sh "$ENVIRONMENT" rollback "$APP" "$MQTT"

  # The apps ship only against a server that verify has just proven live.
  apple:
    needs: verify
    if: ${{ inputs.ship_apple && needs.verify.result == 'success' }}
    uses: ./.github/workflows/apple-release.yml
    with:
      environment: ${{ inputs.environment }}

  # Set by app-store.yml once Apple approves: the app goes live only after the
  # server it needs has been proven live, and never after a rollback.
  app-store:
    needs: verify
    if: ${{ inputs.app_store_version != '' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Release the approved version
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          VERSION: ${{ inputs.app_store_version }}
        run: |
          node apps/apple/asc-review.mjs release martin.rougeron.DissQus-iOS "$VERSION"
          echo "Released **$VERSION** on the App Store." >>"$GITHUB_STEP_SUMMARY"
