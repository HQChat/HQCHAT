# Dependency updates, which nothing was watching.
#
# The GitHub Actions ecosystem is listed FIRST and is the one that matters most
# here: every action is pinned by commit SHA now (a moved tag is a supply-chain
# compromise, and `@v4` is a moving target by design), and a SHA pin does not
# expire — it silently stops receiving security fixes instead. Dependabot is what
# turns that into a pull request rather than into nothing.
#
# The comment after each SHA is the tag it came from; Dependabot reads it and
# keeps it in step when it bumps the pin.
# Monthly and capped: each Dependabot PR runs CI and needs a review. The Rust
# core's crates and the Terraform providers are watched too. Not covered: the
# flake inputs (nixpkgs, rust-overlay) and the EMQX image digest in
# infra/nixos/modules/mqtt.nix, which Dependabot cannot read; scan.yml's
# weekly cargo deny and npm audit report advisories in between.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /services/server
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    groups:
      # One PR for the routine bumps; anything with an advisory comes on its own
      # so it is reviewed on its own.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /apps/site
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "infra"
